# ============================================================
# ✅ Quality Gate Agent — Core Configuration
# AI-Agent Migration Factory™
# ============================================================

agent:
  id: quality-gate
  name: Vera
  icon: "✅"
  version: "1.0.0"
  description: "Code Quality Validation & Testing"
  activation: "@quality-gate"

phase:
  name: MIDSTREAM
  gate: 2
  order: 7

autonomy:
  level: 3
  label: "Monitored"
  yolo_eligible: false
  yolo_scope: null
  approval_required: false
  human_review: "Review only for NEEDS_REVIEW decisions"

engine:
  primary: "Static Analysis (Pylint + Flake8 + mypy + Bandit)"
  secondary: "Dynamic Testing (pytest + coverage)"
  tertiary: "LLM Comparison (GPT-4 semantic equivalence)"
  strategy: "Multi-Dimensional Validation Pipeline"

output:
  base_folder: "./validation-outputs"
  subfolders:
    - validation-reports
    - test-results
    - performance-reports
  naming_convention: "{pipeline_id}.{ext}"

commands:
  - name: validate
    description: "Run full validation pipeline (syntax→lint→semantic→tests→perf→security→score)"
    task_file: tasks/validate-code.md
    autonomy_override: null

  - name: semantic-check
    description: "Compare generated code against original pseudocode for equivalence"
    task_file: tasks/semantic-equivalence.md
    autonomy_override: null

  - name: run-tests
    description: "Execute pytest suite and collect coverage metrics"
    task_file: tasks/run-tests.md
    autonomy_override: null

  - name: check-performance
    description: "Analyze Spark EXPLAIN plans and estimate runtime"
    task_file: tasks/check-performance.md
    autonomy_override: null

  - name: score-pipeline
    description: "Calculate weighted quality score and determine approval decision"
    task_file: tasks/score-pipeline.md
    autonomy_override: null

dependencies:
  upstream:
    - agent: code-generator
      artifact: "generated-code/{pipeline_id}.py"
      required: true
      description: "Generated target platform code from Coda"

    - agent: code-generator
      artifact: "generated-tests/{pipeline_id}_test.py"
      required: true
      description: "Unit tests generated by Coda for the pipeline"

    - agent: logic-extractor
      artifact: "pseudocode/{pipeline_id}.json"
      required: true
      description: "Original pseudocode from Logan for semantic equivalence"

  downstream:
    - agent: self-healing
      artifact: "validation-report/{pipeline_id}.json"
      condition: "rejected"
      description: "Rejected pipelines routed to Phoenix for remediation"

    - agent: reconciliation
      artifact: "validation-report/{pipeline_id}.json"
      condition: "approved"
      description: "Approved pipelines routed to Balance for sign-off"

validation:
  thresholds:
    min_score: 8.0
    min_test_coverage: 80
    semantic_confidence: 0.90
    max_lint_warnings: 10
    max_security_high: 0
    max_security_medium: 3

  weights:
    syntax: 0.15
    lint: 0.10
    semantic: 0.30
    tests: 0.25
    performance: 0.10
    security: 0.10

  decisions:
    approved:
      min_score: 8.0
      route_to: reconciliation
    needs_review:
      min_score: 6.0
      max_score: 7.99
      route_to: human_reviewer
    rejected:
      max_score: 5.99
      route_to: self-healing

tools:
  syntax:
    - name: "Python AST"
      command: "python -c 'import ast; ast.parse(open(file).read())'"
    - name: "py_compile"
      command: "python -m py_compile {file}"

  lint:
    - name: "Pylint"
      command: "pylint --output-format=json {file}"
      config: ".pylintrc"
    - name: "Flake8"
      command: "flake8 --format=json {file}"
      config: ".flake8"
    - name: "mypy"
      command: "mypy --json-report {file}"
      config: "mypy.ini"

  testing:
    - name: "pytest"
      command: "pytest {test_file} --json-report --cov={module} --cov-report=json"
      min_coverage: 80

  performance:
    - name: "Spark EXPLAIN"
      method: "df.explain(mode='extended')"
    - name: "Cost Estimation"
      method: "LLM-based analysis of EXPLAIN output"

  security:
    - name: "Bandit"
      command: "bandit -r {file} -f json"
      severity: "MEDIUM"
