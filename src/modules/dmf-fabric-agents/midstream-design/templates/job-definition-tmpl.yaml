# ============================================================
# ⚙️ Template: Databricks Job Definition
# Agent: Coda (Code Generator)
# API: Databricks Jobs API 2.1
# ============================================================
#
# This YAML template is rendered to JSON for the Databricks Jobs API.
# All {{variables}} are replaced by Coda during generation.
#
# Usage:
#   @code-generator *generate-job --pipeline=PL_CUSTOMER_MASTER
# ============================================================

# --- Job Metadata ---
name: "MIG_{{pipeline_id}}"
description: "Migration pipeline: {{pipeline_description}} — Generated by Coda ⚙️"

tags:
  project: "migration-factory"
  agent: "code-generator"
  pipeline_id: "{{pipeline_id}}"
  pattern: "{{pattern_name}}"
  source_system: "{{source_system}}"
  environment: "{{environment}}"
  wave: "{{wave_id}}"

# --- Schedule ---
schedule:
  quartz_cron_expression: "{{cron_expression}}"
  # Default: "0 0 6 * * ?" (daily at 06:00)
  # Hourly:  "0 0 * * * ?"
  # Weekly:  "0 0 2 ? * MON"
  timezone_id: "{{timezone}}"
  # Default: "America/Sao_Paulo"
  pause_status: "PAUSED"
  # SAFETY: Jobs start PAUSED until manually enabled

# --- Tasks ---
tasks:
  - task_key: "run_{{pipeline_id}}"
    description: "Execute migration pipeline {{pipeline_id}}"

    # Notebook task configuration
    notebook_task:
      notebook_path: "/Repos/migration-factory/pipelines/{{pipeline_id}}"
      source: "WORKSPACE"
      base_parameters:
        environment: "{{environment}}"
        load_date: "{{start_date}}"
        source_catalog: "{{source_catalog}}"
        target_catalog: "{{target_catalog}}"
        source_schema: "{{source_schema}}"
        target_schema: "{{target_schema}}"

    # Cluster configuration
    new_cluster:
      spark_version: "{{spark_version}}"
      # Default: "13.3.x-scala2.12"

      node_type_id: "{{node_type}}"
      # Azure options:
      #   Standard_DS3_v2  (14GB, 4 cores)  — small workloads
      #   Standard_DS4_v2  (28GB, 8 cores)  — medium workloads
      #   Standard_DS5_v2  (56GB, 16 cores) — large workloads
      #   Standard_E8s_v3  (64GB, 8 cores)  — memory-optimized

      num_workers: "{{num_workers}}"
      # Default: 2

      autoscale:
        min_workers: "{{min_workers}}"
        # Default: 1
        max_workers: "{{max_workers}}"
        # Default: 8

      spark_conf:
        # Adaptive Query Execution
        spark.sql.adaptive.enabled: "true"
        spark.sql.adaptive.coalescePartitions.enabled: "true"
        spark.sql.adaptive.skewJoin.enabled: "true"

        # Delta Lake optimizations
        spark.databricks.delta.optimizeWrite.enabled: "true"
        spark.databricks.delta.autoCompact.enabled: "true"

        # I/O cache
        spark.databricks.io.cache.enabled: "true"

        # Partition overwrite mode
        spark.sql.sources.partitionOverwriteMode: "dynamic"

      spark_env_vars:
        PIPELINE_ID: "{{pipeline_id}}"
        ENVIRONMENT: "{{environment}}"

      custom_tags:
        project: "migration-factory"
        pipeline: "{{pipeline_id}}"
        cost_center: "{{cost_center}}"
        team: "data-engineering"

      # Azure-specific
      # azure_attributes:
      #   first_on_demand: 1
      #   availability: "ON_DEMAND_AZURE"
      #   spot_bid_max_price: -1

    # Execution settings
    timeout_seconds: "{{timeout_seconds}}"
    # Default: 3600 (1 hour)
    # Simple ETL: 1800 (30 min)
    # Complex: 5400 (90 min)
    # Full Load: 7200 (2 hours)

    max_retries: "{{max_retries}}"
    # Default: 2

    min_retry_interval_millis: "{{retry_interval_ms}}"
    # Default: 300000 (5 minutes)

    retry_on_timeout: true

# --- Notifications ---
email_notifications:
  on_start: []
  on_success:
    - "{{success_email}}"
    # Default: "data-team@company.com"
  on_failure:
    - "{{failure_email}}"
    - "{{oncall_email}}"
    # Default: "data-team@company.com", "oncall@company.com"
  no_alert_for_skipped_runs: true

webhook_notifications:
  on_failure:
    - id: "{{teams_webhook_id}}"
      # Microsoft Teams webhook for failure alerts

# --- Execution Settings ---
max_concurrent_runs: 1
# Prevent overlapping runs

# --- Access Control (optional) ---
# access_control_list:
#   - user_name: "{{owner_email}}"
#     permission_level: "IS_OWNER"
#   - group_name: "data-engineering"
#     permission_level: "CAN_MANAGE_RUN"
#   - group_name: "data-analysts"
#     permission_level: "CAN_VIEW"

# ============================================================
# VARIABLE REFERENCE
# ============================================================
#
# | Variable              | Description                    | Default              |
# |-----------------------|--------------------------------|----------------------|
# | pipeline_id           | Pipeline identifier            | (required)           |
# | pipeline_description  | Human-readable description     | (required)           |
# | pattern_name          | Code pattern used              | (auto-detected)      |
# | source_system         | Source system name              | (from pseudocode)    |
# | environment           | Deployment environment         | "production"         |
# | wave_id               | Migration wave identifier      | "wave_1"             |
# | cron_expression       | Quartz cron schedule           | "0 0 6 * * ?"        |
# | timezone              | Schedule timezone              | "America/Sao_Paulo"  |
# | spark_version         | Databricks Runtime version     | "13.3.x-scala2.12"  |
# | node_type             | VM node type                   | "Standard_DS3_v2"   |
# | num_workers           | Default worker count           | 2                    |
# | min_workers           | Autoscale min workers          | 1                    |
# | max_workers           | Autoscale max workers          | 8                    |
# | timeout_seconds       | Job timeout                    | 3600                 |
# | max_retries           | Retry attempts                 | 2                    |
# | retry_interval_ms     | Retry interval (ms)            | 300000               |
# | source_catalog        | Source Unity Catalog           | "migration"          |
# | target_catalog        | Target Unity Catalog           | "migration"          |
# | source_schema         | Source schema                  | "raw"                |
# | target_schema         | Target schema                  | "curated"            |
# | success_email         | Success notification email     | "data-team@co.com"   |
# | failure_email         | Failure notification email     | "data-team@co.com"   |
# | oncall_email          | On-call notification email     | "oncall@co.com"      |
# | teams_webhook_id      | MS Teams webhook ID            | (optional)           |
# | cost_center           | Cost center tag                | (optional)           |
# ============================================================
