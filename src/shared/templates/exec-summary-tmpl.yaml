# Best practices
best_practices:
  - "Keep it concise - 2-3 pages max for executives"
  - "Lead with RAG status - Visual, at-a-glance understanding"
  - "Focus on decisions needed - What requires executive action?"
  - "Highlight business impact - Not technical details"
  - "Be honest - Bad news doesn't get better with age"
  - "Provide recommendations - Don't just report problems"
  - "Use visuals - Charts, graphs, trend lines"
  - "Consistent format - Same structure every period"
