## Base Measures

### Total Sales
```dax
Total Sales = 
// Purpose: Calculate total sales revenue
// Author: InsightForge Agent
// Created: {Date}
SUM(FACT_Sales[TotalAmount])
```
| Property | Value |
|----------|-------|
| Format | Currency ($#,##0) |
| Folder | Base Measures |
| Description | Sum of all sales transactions |

### Total Quantity
```dax
Total Quantity = 
// Purpose: Calculate total units sold
SUM(FACT_Sales[Quantity])
```
| Property | Value |
|----------|-------|
| Format | Whole Number (#,##0) |
| Folder | Base Measures |

### Total Cost
```dax
Total Cost = 
// Purpose: Calculate total cost of goods sold
SUM(FACT_Sales[CostAmount])
```

### Gross Margin
```dax
Gross Margin = 
// Purpose: Calculate gross profit
[Total Sales] - [Total Cost]
```

---

## Time Intelligence Measures

### Sales YTD
```dax
Sales YTD = 
// Purpose: Year-to-date sales calculation
// Requires: Date table marked as date table
CALCULATE(
    [Total Sales],
    DATESYTD('Date'[Date])
)
```

### Sales MTD
```dax
Sales MTD = 
// Purpose: Month-to-date sales calculation
CALCULATE(
    [Total Sales],
    DATESMTD('Date'[Date])
)
```

### Sales QTD
```dax
Sales QTD = 
// Purpose: Quarter-to-date sales calculation
CALCULATE(
    [Total Sales],
    DATESQTD('Date'[Date])
)
```

### Sales Previous Year
```dax
Sales PY = 
// Purpose: Same period last year
CALCULATE(
    [Total Sales],
    SAMEPERIODLASTYEAR('Date'[Date])
)
```

### Sales YoY Growth %
```dax
Sales YoY % = 
// Purpose: Year-over-year growth percentage
VAR _currentYear = [Total Sales]
VAR _previousYear = [Sales PY]
RETURN
    DIVIDE(
        _currentYear - _previousYear,
        _previousYear,
        BLANK()
    )
```
| Property | Value |
|----------|-------|
| Format | Percentage (0.0%) |
| Folder | Time Intelligence |

### Sales Previous Month
```dax
Sales PM = 
// Purpose: Previous month sales
CALCULATE(
    [Total Sales],
    PREVIOUSMONTH('Date'[Date])
)
```

### Sales MoM Growth %
```dax
Sales MoM % = 
// Purpose: Month-over-month growth
VAR _currentMonth = [Total Sales]
VAR _previousMonth = [Sales PM]
RETURN
    DIVIDE(
        _currentMonth - _previousMonth,
        _previousMonth,
        BLANK()
    )
```

---

## Comparison Measures

### Sales vs Target
```dax
Sales vs Target = 
// Purpose: Variance to sales target
[Total Sales] - [Sales Target]
```

### Sales vs Target %
```dax
Sales vs Target % = 
// Purpose: Variance percentage to target
DIVIDE(
    [Sales vs Target],
    [Sales Target],
    BLANK()
)
```

### Target Achievement Status
```dax
Target Status = 
// Purpose: Traffic light indicator
VAR _achievement = [Sales vs Target %]
RETURN
    SWITCH(
        TRUE(),
        _achievement >= 0, "🟢 On Target",
        _achievement >= -0.1, "🟡 At Risk",
        "🔴 Below Target"
    )
```

---

## Ratio Measures

### Margin %
```dax
Margin % = 
// Purpose: Gross margin percentage
DIVIDE(
    [Gross Margin],
    [Total Sales],
    BLANK()
)
```

### Sales Mix %
```dax
Sales Mix % = 
// Purpose: Product/category contribution to total
DIVIDE(
    [Total Sales],
    CALCULATE(
        [Total Sales],
        ALLSELECTED(DIM_Product)
    ),
    BLANK()
)
```

### Average Order Value
```dax
Average Order Value = 
// Purpose: Average revenue per order
DIVIDE(
    [Total Sales],
    [Order Count],
    BLANK()
)
```

