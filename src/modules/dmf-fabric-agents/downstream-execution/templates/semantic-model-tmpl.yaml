## Measures

### Base Measures
| Measure Name | DAX | Format | Folder |
|--------------|-----|--------|--------|
| Total Sales | `SUM(FACT_Sales[TotalAmount])` | Currency | Sales |
| Total Quantity | `SUM(FACT_Sales[Quantity])` | Number | Sales |

### Time Intelligence
| Measure Name | DAX | Format | Folder |
|--------------|-----|--------|--------|
| Sales YTD | `CALCULATE([Total Sales], DATESYTD('Date'[Date]))` | Currency | Time Intelligence |
| Sales PY | `CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))` | Currency | Time Intelligence |

### KPIs
| Measure Name | DAX | Format | Folder |
|--------------|-----|--------|--------|
| YoY Growth % | `DIVIDE([Total Sales] - [Sales PY], [Sales PY])` | Percentage | KPIs |

