## Running Totals

### Running Total Sales
```dax
Running Total Sales = 
// Purpose: Cumulative sales over time
CALCULATE(
    [Total Sales],
    FILTER(
        ALLSELECTED('Date'[Date]),
        'Date'[Date] <= MAX('Date'[Date])
    )
)
```

### 3-Month Moving Average
```dax
Sales 3M Avg = 
// Purpose: Rolling 3-month average
AVERAGEX(
    DATESINPERIOD(
        'Date'[Date],
        LASTDATE('Date'[Date]),
        -3,
        MONTH
    ),
    [Total Sales]
)
```

---

## Dynamic Measures

### Selected Measure
```dax
Selected Measure = 
// Purpose: Dynamic measure selection via slicer
VAR _selection = SELECTEDVALUE(MeasureSlicer[MeasureName], "Sales")
RETURN
    SWITCH(
        _selection,
        "Sales", [Total Sales],
        "Quantity", [Total Quantity],
        "Margin", [Gross Margin],
        [Total Sales]
    )
```

