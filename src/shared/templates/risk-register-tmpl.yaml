## RISK SCORING MATRIX

### Probability Scale
probability_scale:
  1: "Very Low (0-10%)"
  2: "Low (10-30%)"
  3: "Medium (30-50%)"
  4: "High (50-70%)"
  5: "Very High (70-100%)"

### Impact Scale
impact_scale:
  1: "Very Low (Negligible impact)"
  2: "Low (Minor impact, manageable)"
  3: "Medium (Moderate impact, workarounds exist)"
  4: "High (Major impact, significant workarounds)"
  5: "Very High (Critical impact, project in jeopardy)"

### Risk Level Matrix
risk_matrix: |

  Impact →   1    2    3    4    5
  Probability ↓
      5      5   10   15   20   25  (Critical)
      4      4    8   12   16   20  (High)
      3      3    6    9   12   15  (Medium)
      2      2    4    6    8   10  (Low)
      1      1    2    3    4    5  (Low)

  Risk Level:
    Critical: Score ≥ 16 (Red)
    High: Score 9-15 (Orange)
    Medium: Score 4-8 (Yellow)
    Low: Score 1-3 (Green)

## RISK RESPONSE STRATEGIES

strategies:
  avoidance:
    description: "Change the project plan to eliminate the risk"
    when_to_use: "Critical risks that threaten project success"
    example: "Use proven technology instead of unproven bleeding-edge"

  transfer:
    description: "Shift the risk to a third party"
    when_to_use: "Risks where specialized expertise needed"
    example: "Purchase insurance, outsource to vendor with warranty"

  mitigation:
    description: "Reduce the probability or impact of the risk"
    when_to_use: "Most common strategy for medium/high risks"
    example: "Add buffer time, cross-train team, implement quality gates"

  acceptance:
    description: "Acknowledge the risk and do nothing (or minimal action)"
    when_to_use: "Low risks or when cost of mitigation > risk impact"
    example: "Accept minor delays, have contingency budget ready"

## RISK MONITORING

### Review Cadence
monitoring:
  daily:
    - "Review critical risks (score ≥ 16)"
    - "Check for new risk triggers"

  weekly:
    - "Review all active risks"
    - "Update risk status and mitigation progress"
    - "Identify new risks"

  monthly:
    - "Deep dive risk review with stakeholders"
    - "Update risk register"
    - "Report to steering committee"

### Key Risk Indicators (KRIs)
kris:
  - indicator: "Number of critical risks"
    threshold: "≤2 critical risks"
    action_if_exceeded: "Escalate to executive sponsor"

  - indicator: "Trend in risk scores"
    threshold: "Stable or decreasing"
    action_if_exceeded: "Root cause analysis, additional mitigation"

  - indicator: "% of mitigation actions on track"
    threshold: "≥80%"
    action_if_exceeded: "Reassign owners, provide support"

