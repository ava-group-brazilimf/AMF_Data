## Ranking Measures

### Product Rank
```dax
Product Rank = 
// Purpose: Rank products by sales
RANKX(
    ALL(DIM_Product[ProductName]),
    [Total Sales],
    ,
    DESC,
    DENSE
)
```

### Customer Rank
```dax
Customer Rank = 
// Purpose: Rank customers by sales
RANKX(
    ALL(DIM_Customer[CustomerName]),
    [Total Sales],
    ,
    DESC,
    DENSE
)
```

