  - term: "CPI"
    definition: "Cost Performance Index (EV/AC) - Measures cost efficiency"
  - term: "SPI"
    definition: "Schedule Performance Index (EV/PV) - Measures schedule efficiency"
  - term: "EV"
    definition: "Earned Value - Value of work completed"
  - term: "PV"
    definition: "Planned Value - Value of work scheduled"
  - term: "AC"
    definition: "Actual Cost - Actual cost of work performed"

